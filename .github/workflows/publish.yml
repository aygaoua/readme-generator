name: Publish Package to npmjs

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Sets up Node.js and tells it to point to the npm registry
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          
      - run: npm ci
      
      # Optional: Only needed if you have a build step (like TypeScript)
      - run: npm run build --if-present
      
      # Publishes the package to npm using the secret token
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
